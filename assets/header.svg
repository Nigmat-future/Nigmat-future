<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Segoe UI',monospace">
  <defs>
    <!-- deep-field background -->
    <radialGradient id="field" cx="28%" cy="42%" r="85%">
      <stop offset="0%"  stop-color="#10212a"/>
      <stop offset="45%" stop-color="#0a141b"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <!-- GFP cytoplasm -->
    <radialGradient id="gfp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3fb950" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#2dd4bf" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rfp" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#f778ba" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#a371f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dapi" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#bfe9ff"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="namegrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eafef9"/>
      <stop offset="55%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#field)"/>

  <!-- ░░ neural / connection mesh ░░ -->
  <g stroke="#2dd4bf" stroke-width="1" fill="none" opacity="0.28">
    <path d="M120,150 C260,60 380,210 520,120 S780,90 940,170 1080,120 1180,160"/>
    <path d="M80,200 C220,170 300,240 470,200 S700,250 880,210 1060,250 1180,220"/>
    <path d="M150,70 C320,120 460,40 600,90 S820,40 1000,80"/>
  </g>
  <g fill="#2dd4bf">
    <circle cx="120" cy="150" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="120" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="170" r="2.5"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="90" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ░░ fluorescent cells (hand-placed) ░░ -->
  <!-- big GFP cell -->
  <g>
    <circle cx="150" cy="135" r="78" fill="url(#gfp)" filter="url(#soft)">
      <animate attributeName="r" values="74;82;74" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="135" r="20" fill="url(#dapi)"/>
    <circle cx="150" cy="135" r="20" fill="none" stroke="#bfe9ff" stroke-width="1" opacity="0.6"/>
  </g>
  <!-- RFP cell -->
  <g>
    <circle cx="1050" cy="120" r="64" fill="url(#rfp)" filter="url(#soft)">
      <animate attributeName="r" values="60;70;60" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="16" fill="url(#dapi)"/>
  </g>
  <!-- small cells -->
  <circle cx="980" cy="205" r="34" fill="url(#gfp)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="28" fill="url(#rfp)" filter="url(#soft)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="60" r="22" fill="url(#gfp)" filter="url(#soft)"/>

  <!-- drifting particles -->
  <g fill="#9fe7da">
    <circle cx="300" cy="210" r="1.6"><animate attributeName="cy" values="210;195;210" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="50" r="1.4"><animate attributeName="cy" values="50;65;50" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="220" r="1.5"><animate attributeName="cy" values="220;205;220" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="40" r="1.3"><animate attributeName="cy" values="40;55;40" dur="6.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ░░ wordmark ░░ -->
  <g filter="url(#glow)">
    <text x="600" y="128" text-anchor="middle" font-size="62" font-weight="800"
          fill="url(#namegrad)" letter-spacing="2">Nigmat Rahim</text>
  </g>
  <text x="600" y="166" text-anchor="middle" font-size="16.5" font-weight="500"
        fill="#9fe7da" letter-spacing="3.5" opacity="0.92">
    BIOMEDICAL&#160;AI &#160;·&#160; AGENTIC&#160;RESEARCH&#160;SYSTEMS &#160;·&#160; BIOINFORMATICS
  </text>

  <!-- scanning beam -->
  <rect x="0" y="0" width="3" height="260" fill="#2dd4bf" opacity="0.0">
    <animate attributeName="x" values="-10;1200" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- frame ticks (microscope reticle vibe) -->
  <g stroke="#2dd4bf" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M24,24 h26 M24,24 v26"/>
    <path d="M1176,24 h-26 M1176,24 v26"/>
    <path d="M24,236 h26 M24,236 v-26"/>
    <path d="M1176,236 h-26 M1176,236 v-26"/>
  </g>
</svg>
